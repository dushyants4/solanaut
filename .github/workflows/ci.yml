# The safety net: milestone 2a.1 in docs/ROADMAP.md. Every gate here was shown failing on an
# injected fault before it was trusted; the receipt is evals/ci/safety-net.md.
#
# Actions are pinned to full commit SHAs, the tag in a comment. Steps after the first run even
# when an earlier one fails, so one push reports every gate it breaks.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: guard tests and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22.18.0, 24, 26.7.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }} # approved runtime matrix; development pin in mise.toml
          cache: npm
      - run: npm ci
      - name: npm test
        run: npm test
      - name: npm run typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: prepare private SDK candidate
        if: ${{ !cancelled() }}
        run: npm run release:prepare
      - name: cache pinned runtime metadata for offline consumer
        if: ${{ !cancelled() }}
        run: npm cache add @gubernaut/core@1.0.1
      - name: installed package checks
        if: ${{ !cancelled() }}
        run: npm run test:package
      - name: installed package fault injections
        if: ${{ !cancelled() }}
        run: npm run test:package:faults
      - name: latch fault injections
        if: ${{ !cancelled() }}
        run: npm run test:latch:faults

  bite:
    name: maintained fault campaigns
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      - run: npm run release:prepare
      - run: npm cache add @gubernaut/core@1.0.1
      - name: sequential fault campaigns with restoration checks
        run: npm run test:bite

  fuzz:
    name: million-input decoder fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      - name: enforce completed fuzz workload
        run: npm run test:fuzz

  replay:
    name: pinned mixed-history replay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22.18.0, 24, 26.7.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: recompute ten thousand decisions and compare pinned digest
        run: npm run test:replay

  kills:
    name: verified persisted-prefix kill recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      - name: verify signals, recover every trial and recompute history
        run: npm run test:kills

  coverage:
    name: AST statement and branch floors
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      - name: complete tests and exact coverage floors
        run: npm run test:coverage

  differential:
    name: pinned real-transaction differential decoding
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      - name: complete all pinned wire, role and client comparisons
        run: npm run test:differential

  traffic:
    name: frozen synthetic benign traffic and loop evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      - name: reconcile the frozen proposal populations and retain loop results
        run: npm run test:traffic

  office:
    name: knowledge vault and write boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false # the tools are stdlib-only uv scripts; nothing to cache
      - name: kb_lint
        run: uv run --script tools/kb_lint.py
      - name: claims_lint, and its self-test
        if: ${{ !cancelled() }}
        run: |
          uv run --script tools/claims_lint.py --selftest
          uv run --script tools/claims_lint.py
      - name: boundary guard self-test, on a runner shaped like its host
        if: ${{ !cancelled() }}
        run: |
          uv run --script tools/ci_host_fixture.py
          cd /home/dashy/Projects/Solanaut
          uv run --script tools/boundary_guard.py --selftest
